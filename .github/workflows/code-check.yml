name: GeoDrill checks

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  drilling-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c deploy/local/constraints.txt -e . -r deploy/local/requirements-chatgpt.txt -r deploy/local/requirements-embedding.txt
      - name: Check Python syntax
        run: python -m compileall -q kag/examples/drilling deploy/local
      - name: Test configuration, authentication protocol and workbench
        run: python -m unittest discover -s kag/examples/drilling/tests -v
